<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamiseten Galeria (insertAdjacentHTML)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        p {
            color: #666;
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        /* Eduki dinamikoa joango den kaxa */
        .gallery-content {
            min-height: 320px;
        }
        h2 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: 28px;
        }
        img {
            width: 100%;
            max-width: 250px;
            height: auto;
            margin: 0 auto 25px auto;
            display: block;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #c0392b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #a93226;
        }
    </style>
</head>
<body>

    <div class="container">
        <p>Pulsa adelante o atrás</p>
        
        <div data-gallery="wrapper" class="gallery-content"></div>
        
        <div class="buttons">
            <button data-action="prev">&lt;&lt;&lt; Atrás</button>
            <button data-action="next">Adelante &gt;&gt;&gt;</button>
        </div>
    </div>

    <script>
        // Kamiseten sekuentzia zehatza array batean (6 -> 9 -> 11)
        const kamisetak = [6, 9, 11];
        let index = 0; // Hasierako posizioa (6 zenbakia)

        // Elementuak hautatu data-atributuen bidez
        const wrapper = document.querySelector('[data-gallery="wrapper"]');
        const botoiAtzera = document.querySelector('[data-action="prev"]');
        const botoiAurrera = document.querySelector('[data-action="next"]');

        // Interfazea eguneratzeko funtzioa insertAdjacentHTML erabiliz
        const eguneratuKamiseta = () => {
            const zenbakia = kamisetak[index];
            
            // 1. Lehenik, kaxa nagusia hustu egiten dugu aurreko kamiseta ezabatzeko
            wrapper.innerHTML = '';
            
            // 2. HTML bloke berria eraikitzen dugu Backtick-ak erabiliz
            const htmlBlokea = `
                <h2>Camiseta ${zenbakia}</h2>
                <img src="camiseta${zenbakia}.jpg" alt="Kamiseta ${zenbakia}">
            `;
            
            // 3. insertAdjacentHTML erabiliz bloke osoa modu eraginkorrean txertatzen duku
            wrapper.insertAdjacentHTML('afterbegin', htmlBlokea);
        };

        // Aurrera botoia (% erabiliz ziklo matematikoa egiteko)
        botoiAurrera.addEventListener('click', () => {
            index = (index + 1) % kamisetak.length;
            eguneratuKamiseta();
        });

        // Atzera botoia (0tik azkenzkora pasatzeko)
        botoiAtzera.addEventListener('click', () => {
            index = (index - 1 + kamisetak.length) % kamisetak.length;
            eguneratuKamiseta();
        });

        // Orria lehenengo aldiz kargatzean hasierako kamiseta marraztu
        eguneratuKamiseta();
    </script>

</body>
</html>
